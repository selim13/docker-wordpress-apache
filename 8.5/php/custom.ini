allow_url_include = ${PHP_ALLOW_URL_INCLUDE:-0}
date.timezone = ${PHP_DATE_TIMEZONE:-UTC}
display_errors = ${PHP_DISPLAY_ERRORS:-0}
error_reporting = ${PHP_ERROR_REPORTING:-E_ALL&~E_DEPRECATED&~E_STRICT}
expose_php = ${PHP_EXPOSE_PHP:-0}
log_errors = ${PHP_LOG_ERRORS:-1}
mail.add_x_header = ${PHP_MAIL_ADD_X_HEADER:-1}
max_execution_time = ${PHP_MAX_EXECUTION_TIME:-120}
max_file_uploads = ${PHP_MAX_FILE_UPLOADS:-50}
max_input_vars = ${PHP_MAX_INPUT_VARS:-3000}
memory_limit = ${PHP_MEMORY_LIMIT:-256M}
post_max_size = ${PHP_POST_MAX_SIZE:-64M}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE:-64M}
pcre.recursion_limit = ${PHP_PCRE_RECURSION_LIMIT:-10000}
realpath_cache_size = ${PHP_REALPATH_CACHE_SIZE:-4096K}
session.gc_maxlifetime = ${PHP_SESSION_GC_MAXLIFETIME:-1440}
session.save_handler = files
session.save_path = ${PHP_SESSION_SAVE_PATH:-/var/tmp/php/session}
mysqli.default_socket = ${PHP_MYSQLI_DEFAULT_SOCKET:-/run/mysqld/mysqld.sock}
sendmail_path = ${PHP_SENDMAIL_PATH:-msmtp -t -i}
sys_temp_dir = ${PHP_SYS_TEMP_DIR:-/var/tmp/php}
upload_tmp_dir = ${PHP_UPLOAD_TMP_DIR:-/var/tmp/php/upload}

opcache.enable = ${PHP_OPCACHE_ENABLE:-1}
opcache.enable_cli = ${PHP_OPCACHE_ENABLE_CLI:-1}
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY_CONSUMPTION:-256}
opcache.interned_strings_buffer = ${PHP_OPCACHE_INTERNED_STRINGS_BUFFER:-16}
opcache.max_accelerated_files = ${PHP_OPCACHE_MAX_ACCELERATED_FILES:-10000}
opcache.max_file_size = ${PHP_OPCACHE_MAX_FILE_SIZE:-0}
opcache.revalidate_freq = ${PHP_OPCACHE_REVALIDATE_FREQ:-2}
opcache.fast_shutdown = ${PHP_OPCACHE_FAST_SHUTDOWN:-1}
opcache.jit_buffer_size = ${PHP_OPCACHE_JIT_BUFFER_SIZE:-0}
opcache.file_cache = ${PHP_OPCACHE_FILE_CACHE:-/var/tmp/php/opcache}

zend_extension = xdebug
xdebug.mode = ${PHP_XDEBUG_MODE:-off}
xdebug.start_with_request = ${PHP_XDEBUG_START_WITH_REQUEST:-no}
