opcache.enable=${PHP_OPCACHE_ENABLE:-1}
opcache.memory_consumption=${PHP_OPCACHE_MEMORY_CONSUMPTION:-128}
opcache.interned_strings_buffer=${PHP_OPCACHE_INTERNED_STRINGS_BUFFER:-8}
opcache.max_accelerated_files=${PHP_OPCACHE_MAX_ACCELERATED_FILES:-4000}
opcache.revalidate_freq=${PHP_OPCACHE_REVALIDATE_FREQ:-60}
opcache.fast_shutdown=${PHP_OPCACHE_FAST_SHUTDOWN:-1}
opcache.enable_cli=${PHP_OPCACHE_ENABLE_CLI:-1}

opcache.file_cache=${PHP_OPCACHE_FILE_CACHE:-/tmp/opcache}
