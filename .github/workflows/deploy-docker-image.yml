name: Deploy docker image

on:
  push:
    branches:
      - "master"
    tags:
      - "*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.4"
          - "8.5"
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.php-version }}
            type=raw,value=latest,enable=${{ matrix.php-version == '8.5' }}
            type=ref,event=branch,suffix=-${{ matrix.php-version }}
            type=semver,pattern={{version}},suffix=-${{ matrix.php-version }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.php-version }}
          images: |
            ${{ secrets.DOCKERHUB_REPOSITORY }}            
            ghcr.io/${{ github.repository }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.php-version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
